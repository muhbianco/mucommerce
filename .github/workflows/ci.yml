name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-lint-test:
    name: api-commerce lint + tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-commerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api-commerce/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -q

  api-mariadb:
    name: api-commerce migrations + drift check (MariaDB 10.11)
    runs-on: ubuntu-latest
    needs: api-lint-test
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mucommerce_test
          MARIADB_USER: mucommerce_migrate
          MARIADB_PASSWORD: migrate
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: apps/api-commerce
    env:
      MARIADB_TEST_URL: mysql+asyncmy://mucommerce_migrate:migrate@127.0.0.1:3306/mucommerce_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api-commerce/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_migrations.py

  web:
    name: web lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  gitleaks:
    name: secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-images:
    name: build + push images
    runs-on: ubuntu-latest
    needs: [api-lint-test, api-mariadb, web]
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          TAGS=("sha-$SHORT")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then TAGS+=("${GITHUB_REF#refs/tags/}" "latest"); fi
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then TAGS+=("main"); fi
          api=""; web=""
          for t in "${TAGS[@]}"; do
            api="${api:+$api,}muhrilobianco/commerce_api:$t"
            web="${web:+$web,}muhrilobianco/commerce_web:$t"
          done
          echo "api_tags=$api" >> "$GITHUB_OUTPUT"
          echo "web_tags=$web" >> "$GITHUB_OUTPUT"
      - name: api image
        uses: docker/build-push-action@v6
        with:
          context: apps/api-commerce
          push: true
          tags: ${{ steps.meta.outputs.api_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ${{ steps.meta.outputs.web_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
