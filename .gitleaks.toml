# gitleaks config for the secrets-scan CI job: the default rules plus one narrow allowlist.
title = "mucommerce"

[extend]
useDefault = true

[allowlist]
description = "Internal service URLs (http://<service>:<port>/<path>) are not credentials"
regexTarget = "line"
regexes = ['''https?://[a-z][a-z0-9-]*:[0-9]{2,5}/''']
# Test-only fixtures (fake master key "0123…cdef" in base64, test password). The Woodpecker job
# scans every tracked file at HEAD, not just the pushed diff, so the fixture file is allowlisted.
paths = ['''apps/api-commerce/tests/conftest\.py$''']
