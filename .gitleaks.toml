# gitleaks config for the secrets-scan CI job: the default rules plus one narrow allowlist.
title = "mucommerce"

[extend]
useDefault = true

[allowlist]
description = "Internal service URLs (http://<service>:<port>/<path>) are not credentials"
regexTarget = "line"
regexes = ['''https?://[a-z][a-z0-9-]*:[0-9]{2,5}/''']
