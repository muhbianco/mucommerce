# Push no main = deploy do commerce. Tag imutável = sha12 do commit (COMMERCE_TAG).
# Ordem: build das duas imagens → migração one-shot (expand first) → StackUpdate do Portainer
# com o YAML do repo e COMMERCE_TAG novo (dry-run antes) → espera os 5 serviços na tag → smoke.
# Segredos: /root/.mucommerce.env (migração) e /root/.portainer-token (API do Portainer), do host.
when:
  - event: push
    branch: main

depends_on: [ci]

# Histórico real (o clone padrão é parcial, depth 1): a guarda de ordem do hel1-deploy usa ancestralidade.
clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      depth: 50
      partial: false

steps:
  build-api:
    image: muhrilobianco/ci-deployer:1
    pull: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/root/.docker/config.json:ro
    commands:
      - hel1-build --image muhrilobianco/commerce_api --tag ${CI_COMMIT_SHA:0:12} --context apps/api-commerce --extra-tag latest

  build-web:
    image: muhrilobianco/ci-deployer:1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/root/.docker/config.json:ro
    commands:
      - hel1-build --image muhrilobianco/commerce_web --tag ${CI_COMMIT_SHA:0:12} --context apps/web --extra-tag latest

  deploy:
    image: muhrilobianco/ci-deployer:1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/root/.docker/config.json:ro
      - /var/lib/hel1-deploy:/var/lib/hel1-deploy
      - /root/.mucommerce.env:/root/.mucommerce.env:ro
      - /root/.portainer-token:/root/.portainer-token:ro
    environment:
      PORTAINER_URL: https://portainer.muhbianco.com.br
    commands:
      - >-
        hel1-deploy exec --app commerce --tag ${CI_COMMIT_SHA:0:12}
        --wait-services commerce_commerce-api,commerce_commerce-worker,commerce_commerce-media,commerce_commerce-beat,commerce_commerce-web
        --smoke https://api-commerce.muhbianco.com.br/healthz
        -- infra/scripts/deploy.sh ${CI_COMMIT_SHA:0:12}
