# =============================================================================
# mucommerce — Stack Portainer (Docker Swarm + Traefik) — hel1
# Stack: commerce            Rede: chatbot-net (Chatwoot, Redis, MinIO, api-agents)
# Imagens: muhrilobianco/commerce_api:${COMMERCE_TAG}, muhrilobianco/commerce_web:${COMMERCE_TAG}
#   COMMERCE_TAG = sha12 do commit (Woodpecker, .woodpecker/deploy.yaml); nunca `latest` em produção.
#
# Secrets e COMMERCE_TAG vêm do Env do Portainer (${VAR}). O StackUpdate SUBSTITUI o Env
# inteiro: sempre via hel1-ops/scripts/portainer-stack-update.py (reenvia todas as chaves).
# Migrations NÃO rodam no boot: `infra/scripts/deploy.sh <tag>` roda commerce-migrate.sh antes
# do StackUpdate (push no main faz isso sozinho).
#
# Serviços com prefixo `commerce-`: o nome curto do serviço vira alias DNS na chatbot-net, e
# nomes genéricos (`api`, `web`) já capturaram tráfego de outras stacks.
#
# Hosts estáticos (labels): loja.muhbianco.com.br, painel.muhbianco.com.br -> commerce-web
#                           api-commerce.muhbianco.com.br -> commerce-api
# /metrics, /readyz e /api/*/internal/* não têm rota pública (só a rede interna alcança).
# Hosts de tenant chegam pelo providers.http do Traefik (infra/traefik/README.md).
# =============================================================================

version: "3.8"

x-api-env: &api_env
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  DOCS_ENABLED: "false"
  DB_HOST: host.docker.internal
  DB_PORT: "3306"
  DB_NAME: mucommerce
  DB_USER: mucommerce_app
  DB_PASSWORD: ${DB_PASSWORD}
  MIGRATE_DB_USER: mucommerce_migrate
  MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD}
  RUN_MIGRATIONS_ON_STARTUP: "false"
  REDIS_URL: redis://redis_redis:6379/4
  CELERY_BROKER_URL: redis://redis_redis:6379/3
  CELERY_RESULT_BACKEND: redis://redis_redis:6379/3
  JWT_SECRET: ${JWT_SECRET}
  INTERNAL_TOKEN_WEB: ${INTERNAL_TOKEN_WEB}
  INTERNAL_TOKEN_TRAEFIK: ${INTERNAL_TOKEN_TRAEFIK}
  INTERNAL_TOKEN_AGENTS: ${INTERNAL_TOKEN_AGENTS}
  CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY}
  CREDENTIALS_KEY_VERSION: "1"
  PLATFORM_TENANT_SLUG: muhbianco
  PLATFORM_BASE_DOMAIN: loja.muhbianco.com.br
  PANEL_HOST: painel.muhbianco.com.br
  API_PUBLIC_HOST: api-commerce.muhbianco.com.br
  EDGE_CNAME_TARGET: edge.muhbianco.com.br
  EDGE_PUBLIC_IPS: ${EDGE_PUBLIC_IPS}
  EDGE_WEB_UPSTREAM: http://commerce-web:3000
  EDGE_API_UPSTREAM: http://commerce-api:8000
  CHATWOOT_PUBLIC_URL: https://chatwoot.muhbianco.com.br
  SENTRY_DSN: ${SENTRY_DSN}
  METRICS_ENABLED: "true"
  # MinIO: internal S3 API for the server; browsers upload to / read from the public host.
  # Keys come from /root/.mucommerce-minio.env (infra/minio/setup.sh), merged into the stack
  # Env by hel1-ops/scripts/portainer-stack-update.py --env-file.
  # Staff sign in with their MuhBianco account: the API redeems one-time codes at api-agents over
  # chatbot-net; the site admin "Lojas" page calls the API from https://muhbianco.com.br (CORS).
  MUHBIANCO_ACCOUNTS_INTERNAL_URL: http://api_agents:8000
  CORS_ORIGINS: https://muhbianco.com.br
  # Store customers sign in with Google through the stores' own OAuth client (not the MuhBianco
  # account). The Env keeps the owner's names; the callback is api-commerce's central one.
  GOOGLE_CUSTOMER_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
  GOOGLE_CUSTOMER_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
  STORAGE_ENDPOINT: http://minio:9000
  STORAGE_PUBLIC_URL: https://storage.s3.muhbianco.com.br
  STORAGE_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  STORAGE_SECRET_KEY: ${MINIO_SECRET_KEY}

services:
  commerce-api:
    image: muhrilobianco/commerce_api:${COMMERCE_TAG:?COMMERCE_TAG obrigatorio}
    environment:
      <<: *api_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chatbot-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=chatbot-net
        # /healthz (liveness) stays public; readiness, metrics and /internal do not.
        - traefik.http.routers.commerce_api.rule=Host(`api-commerce.muhbianco.com.br`) && !PathPrefix(`/metrics`) && !PathPrefix(`/readyz`) && !PathRegexp(`^/api/(v1|latest)/internal`)
        - traefik.http.routers.commerce_api.entrypoints=websecure
        - traefik.http.routers.commerce_api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.commerce_api.priority=20
        - traefik.http.routers.commerce_api.service=commerce_api
        - traefik.http.routers.commerce_api.middlewares=commerce_headers
        - traefik.http.services.commerce_api.loadbalancer.server.port=8000
        - traefik.http.services.commerce_api.loadbalancer.passHostHeader=true
        - traefik.http.services.commerce_api.loadbalancer.healthcheck.path=/healthz
        - traefik.http.services.commerce_api.loadbalancer.healthcheck.interval=15s
        - traefik.http.middlewares.commerce_headers.headers.stsSeconds=31536000
        - traefik.http.middlewares.commerce_headers.headers.stsIncludeSubdomains=true
        - traefik.http.middlewares.commerce_headers.headers.contentTypeNosniff=true
        - traefik.http.middlewares.commerce_headers.headers.browserXssFilter=true
        - traefik.http.middlewares.commerce_headers.headers.referrerPolicy=strict-origin-when-cross-origin
        - traefik.http.middlewares.commerce_headers.headers.customFrameOptionsValue=DENY
        - traefik.http.middlewares.commerce_headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow

  commerce-worker:
    image: muhrilobianco/commerce_api:${COMMERCE_TAG:?COMMERCE_TAG obrigatorio}
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - -l
      - info
      - -Q
      - commerce.default,commerce.outbox,commerce.payments,commerce.notifications,commerce.provisioning
      - --concurrency=2
    environment:
      <<: *api_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chatbot-net
    # Same image as api; Dockerfile HEALTHCHECK hits :8000/healthz and would SIGTERM Celery.
    healthcheck:
      disable: true
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M

  # Image processing only: one process, so a burst of uploads decodes one image at a time and
  # never starves the outbox/payments worker of memory or CPU.
  commerce-media:
    image: muhrilobianco/commerce_api:${COMMERCE_TAG:?COMMERCE_TAG obrigatorio}
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - -l
      - info
      - -Q
      - commerce.media
      - --concurrency=1
      - --hostname=media@%h
    environment:
      <<: *api_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chatbot-net
    healthcheck:
      disable: true
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M

  commerce-beat:
    image: muhrilobianco/commerce_api:${COMMERCE_TAG:?COMMERCE_TAG obrigatorio}
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - beat
      - -l
      - info
      - -s
      - /tmp/celerybeat-schedule
    environment:
      <<: *api_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chatbot-net
    healthcheck:
      disable: true
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          cpus: "0.10"
          memory: 128M

  commerce-web:
    image: muhrilobianco/commerce_web:${COMMERCE_TAG:?COMMERCE_TAG obrigatorio}
    environment:
      NODE_ENV: production
      PORT: "3000"
      COMMERCE_API_INTERNAL_URL: http://commerce-api:8000
      INTERNAL_TOKEN_WEB: ${INTERNAL_TOKEN_WEB}
      PANEL_HOST: painel.muhbianco.com.br
      PLATFORM_BASE_DOMAIN: loja.muhbianco.com.br
      # Public MuhBianco login (api-agents) the panel's "Entrar com Google" goes through.
      MUHBIANCO_ACCOUNTS_URL: https://api.muhbianco.com.br
    networks:
      - chatbot-net
    deploy:
      mode: replicated
      # Keep 1: the panel's refresh single-flight (lib/panel/refresh.ts) is per process, and the
      # API revokes the whole session family on refresh-token reuse. Scaling out needs sticky
      # sessions or a reuse grace window in the API first.
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=chatbot-net
        - traefik.http.routers.commerce_web.rule=Host(`loja.muhbianco.com.br`) || Host(`painel.muhbianco.com.br`)
        - traefik.http.routers.commerce_web.entrypoints=websecure
        - traefik.http.routers.commerce_web.tls.certresolver=letsencryptresolver
        - traefik.http.routers.commerce_web.priority=10
        - traefik.http.routers.commerce_web.service=commerce_web
        - traefik.http.services.commerce_web.loadbalancer.server.port=3000
        - traefik.http.services.commerce_web.loadbalancer.passHostHeader=true
        # /api dos hosts estáticos vai para a API (mesmo host = cookies first-party)
        - traefik.http.routers.commerce_web_api.rule=(Host(`loja.muhbianco.com.br`) || Host(`painel.muhbianco.com.br`)) && PathPrefix(`/api`) && !PathRegexp(`^/api/(v1|latest)/internal`)
        - traefik.http.routers.commerce_web_api.entrypoints=websecure
        - traefik.http.routers.commerce_web_api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.commerce_web_api.priority=20
        - traefik.http.routers.commerce_web_api.service=commerce_api

networks:
  chatbot-net:
    external: true
    name: chatbot-net
